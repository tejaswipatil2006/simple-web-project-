<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Smart Notes AI Assistant</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
        <i class="bi bi-journal-bookmark-fill text-primary"></i>
        <span>Smart Notes <span class="badge bg-primary text-white">AI</span></span>
      </a>
      <a href="/" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left me-1"></i> Home</a>
    </div>
  </nav>

  <!-- Register Form Section -->
  <main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
          
          <!-- Alert Container -->
          <div id="authAlertContainer" class="mb-3"></div>

          <div class="card shadow-sm border-0 rounded-3 bg-white p-4">
            <div class="text-center mb-4">
              <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle p-3 mb-2" style="width: 56px; height: 56px;">
                <i class="bi bi-person-plus-fill fs-3"></i>
              </div>
              <h3 class="fw-bold text-dark mb-1">Create Account</h3>
              <p class="text-secondary small">Sign up with Firebase to start organizing notes with Gemini AI.</p>
            </div>

            <form id="registerForm" novalidate>
              <!-- Email Input -->
              <div class="mb-3">
                <label for="registerEmail" class="form-label fw-semibold text-secondary small">Email Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                  <input 
                    type="email" 
                    class="form-control" 
                    id="registerEmail" 
                    placeholder="name@example.com" 
                    required 
                    autocomplete="email"
                  >
                </div>
              </div>

              <!-- Password Input -->
              <div class="mb-3">
                <label for="registerPassword" class="form-label fw-semibold text-secondary small">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light text-muted"><i class="bi bi-key"></i></span>
                  <input 
                    type="password" 
                    class="form-control" 
                    id="registerPassword" 
                    placeholder="At least 6 characters" 
                    required 
                    autocomplete="new-password"
                  >
                </div>
              </div>

              <!-- Confirm Password Input -->
              <div class="mb-4">
                <label for="registerConfirmPassword" class="form-label fw-semibold text-secondary small">Confirm Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light text-muted"><i class="bi bi-check-circle"></i></span>
                  <input 
                    type="password" 
                    class="form-control" 
                    id="registerConfirmPassword" 
                    placeholder="Re-enter your password" 
                    required 
                    autocomplete="new-password"
                  >
                </div>
              </div>

              <!-- Submit Button -->
              <div class="d-grid mb-3">
                <button type="submit" id="registerSubmitBtn" class="btn btn-primary btn-lg shadow-sm">
                  Register
                </button>
              </div>
            </form>

            <div class="text-center mt-3 pt-3 border-top text-secondary small">
              Already have an account? 
              <a href="/login" class="fw-semibold text-primary text-decoration-none">Login here</a>
            </div>

          </div>

          <div class="text-center text-muted small mt-4">
            <i class="bi bi-shield-check me-1"></i> Data stored in Google Cloud Firestore
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-white border-top py-3 text-center text-muted small">
    <div class="container">
      Smart Notes AI Assistant &bull; Python Flask + Firebase Firestore
    </div>
  </footer>

  <!-- Firebase Compatibility Web SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-auth-compat.js"></script>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Client Application Script -->
  <script src="/static/js/app.js"></script>
</body>
</html>
